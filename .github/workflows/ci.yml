name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: 1.24.x
          - os: ubuntu-latest
            go-version: 1.25.x
          - os: ubuntu-latest
            go-version: 1.26.x
          - os: macos-latest
            go-version: 1.24.x
          - os: windows-latest
            go-version: 1.24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & go test ./... 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $detail = ($output | Select-Object -Last 200) -join "`n"
            $detail = $detail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows Go tests failed::$detail"
            exit $exitCode
          }

      - name: Build package tests
        run: go test -c ./internal/transport
